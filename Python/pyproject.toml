[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-insight-mcp"
version = "0.1.0"
description = "Unreal Insights MCP Server — AI-driven Trace & performance analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "yangskin"}]

dependencies = [
    "mcp==1.26.0",
]

[project.scripts]
ue-insight-mcp = "ue_insight_mcp.server_unified:main"

[tool.setuptools.packages.find]
include = ["ue_insight_mcp*"]
